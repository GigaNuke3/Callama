<!DOCTYPE html>
<html lang="en" data-theme="callama">
<head>
<meta charset="UTF-8" />
<title>Callama</title>
<link rel="stylesheet" href="output.css" />
<script src="marked.umd.js"></script>
</head>
<body class="bg-base-100 text-base-content">
  <div class="flex h-screen overflow-hidden">

    <aside class="w-64 shrink-0 border-r border-base-300 flex flex-col p-3 gap-3 overflow-hidden">
      <div class="px-1 pt-1">
        <h1 class="font-display text-base tracking-wide">callama</h1>
        <p class="text-[11px] text-base-content/45 mt-0.5 flex items-center gap-1.5">
          <span id="ollama-dot" class="inline-block w-1.5 h-1.5 rounded-full bg-base-content/30"></span>
          <span id="ollama-status-text">offline &middot; subject-scoped</span>
        </p>
      </div>

      <div class="flex gap-2">
        <button id="new-chat-btn" class="btn btn-sm btn-outline justify-start font-display normal-case flex-1">
          + new chat
        </button>
        <button id="memory-btn" class="btn btn-sm btn-outline font-display normal-case" title="View memories">
          mem
        </button>
      </div>

      <div id="new-chat-form" class="hidden flex-col gap-2 border border-base-300 rounded-lg p-2">
        <label class="text-[10px] font-display uppercase tracking-widest text-base-content/40">subject</label>
        <select id="new-chat-subject" class="select select-sm select-bordered w-full">
          <option value="predictability" selected>predictability</option>
          <option value="health">health</option>
          <option value="wellbeing">wellbeing</option>
          <option value="education">education</option>
          <option value="logicalthinking">logicalthinking</option>
        </select>
        <div class="flex gap-2">
          <button id="new-chat-confirm" class="btn btn-sm btn-primary font-display normal-case flex-1">create</button>
          <button id="new-chat-cancel" class="btn btn-sm btn-ghost font-display normal-case">cancel</button>
        </div>
      </div>

      <input
        id="chat-search"
        type="text"
        placeholder="search chats..."
        class="input input-sm input-bordered w-full mt-1"
      />
      <div id="chat-list" class="flex-1 overflow-y-auto flex flex-col gap-0.5 -mx-1 px-1"></div>

      <div class="flex flex-col gap-3 border-t border-base-300 pt-3">
        <div>
          <label class="text-[10px] font-display uppercase tracking-widest text-base-content/40">model</label>
          <select id="model" class="select select-sm select-bordered w-full mt-1"></select>
        </div>
        <div>
          <label class="text-[10px] font-display uppercase tracking-widest text-base-content/40">
            temperature <span id="temp-val" class="text-base-content/70">0.7</span>
            <span class="text-base-content/30">(auto, by subject)</span>
          </label>
          <input id="temperature" type="range" min="0" max="1" step="0.1" value="0.7" disabled
                 class="range range-xs range-primary mt-2 opacity-60 cursor-not-allowed" />
        </div>
      </div>
    </aside>

    <main class="flex-1 flex flex-col min-w-0">
      <header class="border-b border-base-300 px-6 py-3 shrink-0">
        <h2 id="chat-title" class="font-display text-sm tracking-wide"></h2>
        <p id="chat-subject-desc" class="text-[12px] text-base-content/50 mt-0.5"></p>
      </header>

      <div id="history" class="flex-1 overflow-y-auto px-6 py-5 flex flex-col"></div>

      <form id="form" class="border-t border-base-300 p-3 flex gap-2 items-end shrink-0">
        <textarea
          id="input"
          rows="1"
          class="textarea textarea-bordered flex-1 resize-none leading-relaxed"
          placeholder="Ask something..."
        ></textarea>
        <button type="submit" id="send-btn" class="btn btn-primary font-display normal-case">send</button>
      </form>
    </main>

  </div>

  <dialog id="memory-modal" class="modal">
    <div class="modal-box max-w-lg">
      <h3 class="font-display text-sm uppercase tracking-wide">memories</h3>
      <p class="text-[12px] text-base-content/50 mt-1">
        Facts saved from conversations, searched by relevance rather than recency —
        these can surface even in a brand new chat if they're relevant to what you ask.
      </p>
      <div id="memory-list" class="mt-4 flex flex-col gap-2 max-h-96 overflow-y-auto"></div>
      <div class="modal-action">
        <form method="dialog">
          <button class="btn btn-sm font-display normal-case">close</button>
        </form>
      </div>
    </div>
    <form method="dialog" class="modal-backdrop"><button>close</button></form>
  </dialog>

<script>
const SUBJECT_DESC = {
  predictability: 'Day-to-day questions. Default context — reads across all four subjects.',
  health:         'Physical & mental health questions. Linked with wellbeing.',
  wellbeing:      'Mental health, philosophy, focusing on yourself. Linked with health.',
  education:      'Creative writing & general knowledge. Linked with logicalthinking.',
  logicalthinking:'Code, math, engineering. Linked with education.',
};

// Static, per-subject temperature — not user-adjustable. Lower values
// for subjects where correctness matters more than variety (logical
// thinking, health); higher values where natural, varied phrasing is
// the point (predictability, general conversation).
const SUBJECT_TEMPERATURE = {
  logicalthinking: 0.2,
  health: 0.3,
  wellbeing: 0.6,
  education: 0.6,
  predictability: 0.7,
};

let chats = [];
let activeChatId = null;
let streamingBubble = null;
let streamingRaw = '';
const streamingChats = new Set();

const chatListEl = document.getElementById('chat-list');
const newChatBtn = document.getElementById('new-chat-btn');
const memoryBtn = document.getElementById('memory-btn');
const memoryModal = document.getElementById('memory-modal');
const memoryListEl = document.getElementById('memory-list');
const newChatForm = document.getElementById('new-chat-form');
const newChatSubject = document.getElementById('new-chat-subject');
const newChatConfirm = document.getElementById('new-chat-confirm');
const newChatCancel = document.getElementById('new-chat-cancel');
const historyEl = document.getElementById('history');
const formEl = document.getElementById('form');
const sendBtn = document.getElementById('send-btn');
const ollamaDot = document.getElementById('ollama-dot');
const ollamaStatusText = document.getElementById('ollama-status-text');
const inputEl = document.getElementById('input');
const modelEl = document.getElementById('model');
const tempEl = document.getElementById('temperature');
const tempValEl = document.getElementById('temp-val');
const titleEl = document.getElementById('chat-title');
const descEl = document.getElementById('chat-subject-desc');

newChatBtn.addEventListener('click', () => {
  newChatForm.classList.remove('hidden');
  newChatForm.classList.add('flex');
  newChatBtn.classList.add('hidden');
});

memoryBtn.addEventListener('click', () => openMemoryModal());

async function openMemoryModal() {
  const memories = await window.callama.listMemories();
  memoryListEl.innerHTML = '';
  if (memories.length === 0) {
    const empty = document.createElement('p');
    empty.className = 'text-[12px] text-base-content/40';
    empty.textContent = 'No memories saved yet — hover a message and click "remember" to save one.';
    memoryListEl.appendChild(empty);
  }
  for (const m of memories) {
    const row = document.createElement('div');
    row.className = 'flex items-start gap-2 border-b border-base-300 pb-2';

    const text = document.createElement('div');
    text.className = 'flex-1 text-[12px]';
    const tag = document.createElement('span');
    tag.className = 'font-display text-base-content/40 mr-1';
    tag.textContent = `[${m.subject}]`;
    text.appendChild(tag);
    text.appendChild(document.createTextNode(m.content));
    row.appendChild(text);

    const del = document.createElement('button');
    del.className = 'text-[13px] text-base-content/40 hover:text-base-content shrink-0';
    del.textContent = '×';
    del.title = 'Delete this memory';
    del.addEventListener('click', async () => {
      await window.callama.deleteMemory(m.id);
      openMemoryModal();
    });
    row.appendChild(del);

    memoryListEl.appendChild(row);
  }
  memoryModal.showModal();
}

newChatCancel.addEventListener('click', () => closeNewChatForm());
function closeNewChatForm() {
  newChatForm.classList.add('hidden');
  newChatForm.classList.remove('flex');
  newChatBtn.classList.remove('hidden');
  newChatSubject.value = 'predictability';
}

newChatConfirm.addEventListener('click', async () => {
  const chat = await window.callama.createChat(newChatSubject.value);
  closeNewChatForm();
  await refreshChatList();
  await setActiveChat(chat.id);
});

let searchTerm = '';
const chatSearchEl = document.getElementById('chat-search');
chatSearchEl.addEventListener('input', () => {
  searchTerm = chatSearchEl.value;
  renderChatList();
});

async function refreshChatList() {
  chats = await window.callama.listChats();
  renderChatList();
}

function renderChatList() {
  chatListEl.innerHTML = '';
  const term = searchTerm.trim().toLowerCase();
  const visible = term ? chats.filter((c) => c.title.toLowerCase().includes(term)) : chats;
  const pinned = visible.filter((c) => c.pinned);
  const unpinned = visible.filter((c) => !c.pinned);

  if (pinned.length > 0) {
    chatListEl.appendChild(sectionLabel('pinned'));
    for (const chat of pinned) chatListEl.appendChild(chatListItem(chat));
  }
  if (pinned.length > 0 && unpinned.length > 0) {
    chatListEl.appendChild(sectionLabel('chats'));
  }
  for (const chat of unpinned) chatListEl.appendChild(chatListItem(chat));

  if (visible.length === 0) {
    const empty = document.createElement('p');
    empty.className = 'text-[12px] text-base-content/40 px-1 mt-2';
    empty.textContent = term ? 'No chats match your search.' : 'No chats yet.';
    chatListEl.appendChild(empty);
  }
}

function sectionLabel(text) {
  const el = document.createElement('div');
  el.className = 'text-[10px] font-display uppercase tracking-widest text-base-content/40 px-1 mt-2 mb-0.5';
  el.textContent = text;
  return el;
}

function chatListItem(chat) {
  const row = document.createElement('div');
  row.className = 'group flex items-center gap-1 rounded-md px-2 py-1.5 cursor-pointer hover:bg-base-200' +
    (chat.id === activeChatId ? ' bg-base-200' : '');
  row.dataset.chatId = chat.id;

  const title = document.createElement('span');
  title.className = 'flex-1 text-[13px] truncate';
  title.textContent = chat.title;
  row.appendChild(title);

  const subjectTag = document.createElement('span');
  subjectTag.className = 'text-[10px] font-display text-base-content/35 shrink-0';
  subjectTag.textContent = chat.subject.slice(0, 4);
  row.appendChild(subjectTag);

  const pinBtn = iconBtn('pin', chat.pinned);
  const editBtn = iconBtn('rename');
  const delBtn = iconBtn('delete');
  // A pinned chat's pin action stays visible always (so you can find
  // your way back to unpin it without having to hover first); rename
  // and delete stay hover-only either way to keep the row uncluttered.
  if (!chat.pinned) pinBtn.classList.add('opacity-0', 'group-hover:opacity-100');
  editBtn.classList.add('opacity-0', 'group-hover:opacity-100');
  delBtn.classList.add('opacity-0', 'group-hover:opacity-100');

  pinBtn.addEventListener('click', async (e) => {
    e.stopPropagation();
    await window.callama.setPinned(chat.id, !chat.pinned);
    await refreshChatList();
  });
  editBtn.addEventListener('click', (e) => { e.stopPropagation(); renameChatInline(row, chat, title); });
  delBtn.addEventListener('click', async (e) => {
    e.stopPropagation();
    await window.callama.deleteChat(chat.id);
    if (activeChatId === chat.id) activeChatId = null;
    await refreshChatList();
    if (!activeChatId && chats.length > 0) await setActiveChat(chats[0].id);
    else if (!chats.length) { titleEl.textContent = ''; descEl.textContent = ''; historyEl.innerHTML = ''; }
  });

  row.appendChild(pinBtn);
  row.appendChild(editBtn);
  row.appendChild(delBtn);
  row.addEventListener('click', () => setActiveChat(chat.id));
  return row;
}

function iconBtn(kind, active = false) {
  const btn = document.createElement('button');
  btn.className = 'shrink-0 text-[11px] px-1 transition-opacity ' +
    (active ? 'text-base-content' : 'text-base-content/50 hover:text-base-content');
  btn.textContent = kind === 'rename' ? '✎' : kind === 'pin' ? (active ? '◆' : '◇') : '×';
  btn.title = kind === 'rename' ? 'Rename' : kind === 'pin' ? (active ? 'Unpin' : 'Pin') : 'Delete';
  return btn;
}

function renameChatInline(row, chat, titleEl2) {
  const input = document.createElement('input');
  input.className = 'input input-xs input-bordered flex-1';
  input.value = chat.title;
  titleEl2.replaceWith(input);
  input.focus();
  input.select();

  const commit = async () => {
    const newTitle = input.value.trim() || chat.title;
    await window.callama.renameChat(chat.id, newTitle);
    chat.title = newTitle;
    await refreshChatList();
  };
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); commit(); }
    if (e.key === 'Escape') refreshChatList();
  });
  input.addEventListener('blur', commit);
}

async function setActiveChat(chatId) {
  activeChatId = chatId;
  const chat = chats.find((c) => c.id === chatId);
  if (chat) {
    titleEl.textContent = chat.title;
    descEl.textContent = SUBJECT_DESC[chat.subject];
    const temp = SUBJECT_TEMPERATURE[chat.subject];
    tempEl.value = temp;
    tempValEl.textContent = temp;
  }
  await refreshChatList();
  await loadHistory();
  updateSendButton();
}

function updateSendButton() {
  const streaming = streamingChats.has(activeChatId);
  sendBtn.textContent = streaming ? 'stop' : 'send';
  sendBtn.type = streaming ? 'button' : 'submit';
  sendBtn.classList.toggle('btn-primary', !streaming);
  sendBtn.classList.toggle('btn-outline', streaming);
}
sendBtn.addEventListener('click', (e) => {
  if (sendBtn.type === 'button') {
    e.preventDefault();
    window.callama.stop(activeChatId);
  }
});

function bubble(row, { isLastAssistant = false } = {}) {
  const isUser = row.role === 'user';
  const wrap = document.createElement('div');
  wrap.className = `chat ${isUser ? 'chat-end' : 'chat-start'} group`;

  const content = document.createElement('div');
  content.className = `chat-bubble ${isUser ? 'chat-bubble-primary' : ''} ${isUser ? 'whitespace-pre-wrap' : 'markdown-content'}`;
  if (isUser) {
    content.textContent = row.content;
  } else {
    content.innerHTML = marked.parse(row.content);
  }
  wrap.appendChild(content);

  if (!row.id) return wrap;

  const actions = [];
  if (isUser) {
    actions.push([row.edited_at ? 'edited · click to edit again' : 'edit', () => startEdit(wrap, content, row)]);
  }
  if (!isUser && isLastAssistant) {
    actions.push(['regenerate', () => regenerate(wrap, row)]);
  }
  actions.push(['remember', (actionEl) => saveAsMemory(row, actionEl)]);

  const footer = document.createElement('div');
  footer.className = 'chat-footer opacity-0 group-hover:opacity-100 flex gap-2 text-[11px] text-base-content/40 mt-0.5 transition-opacity';
  for (const [label, handler] of actions) {
    const actionEl = document.createElement('span');
    actionEl.className = 'cursor-pointer hover:text-base-content';
    actionEl.textContent = label;
    actionEl.addEventListener('click', () => handler(actionEl));
    footer.appendChild(actionEl);
  }
  wrap.appendChild(footer);

  return wrap;
}

async function saveAsMemory(row, actionEl) {
  const activeChat = chats.find((c) => c.id === activeChatId);
  if (!activeChat) return;
  actionEl.textContent = 'saving...';
  const result = await window.callama.saveMemory(activeChat.subject, row.content, activeChatId);
  actionEl.textContent = result.saved
    ? 'saved ✓'
    : result.reason === 'duplicate' ? 'already saved' : 'unavailable';
  if (!result.saved) {
    setTimeout(() => { actionEl.textContent = 'remember'; }, 1500);
  }
}

async function regenerate(wrap, row) {
  if (streamingChats.has(activeChatId)) return;
  const chatId = activeChatId;
  while (wrap.nextSibling) wrap.nextSibling.remove();
  wrap.remove();
  streamingChats.add(chatId);
  updateSendButton();
  await window.callama.regenerate({
    chatId,
    id: row.id,
    model: modelEl.value,
    temperature: parseFloat(tempEl.value),
  });
  await refreshChatList();
  await loadHistory();
}

function startEdit(wrap, contentEl, row) {
  const textarea = document.createElement('textarea');
  textarea.className = 'textarea textarea-bordered textarea-sm w-80 whitespace-pre-wrap';
  textarea.value = row.content;
  contentEl.replaceWith(textarea);
  textarea.focus();

  const commit = async () => {
    const newContent = textarea.value.trim();
    if (!newContent || newContent === row.content) { loadHistory(); return; }
    while (wrap.nextSibling) wrap.nextSibling.remove();
    textarea.replaceWith(bubbleContentOnly(newContent));
    streamingChats.add(activeChatId);
    updateSendButton();
    await window.callama.edit({
      chatId: activeChatId,
      id: row.id,
      content: newContent,
      model: modelEl.value,
      temperature: parseFloat(tempEl.value),
    });
    await refreshChatList();
  };

  textarea.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); commit(); }
  });
  textarea.addEventListener('blur', commit);
}

function bubbleContentOnly(text) {
  const el = document.createElement('div');
  el.className = 'chat-bubble chat-bubble-primary whitespace-pre-wrap';
  el.textContent = text;
  return el;
}

async function loadHistory() {
  historyEl.innerHTML = '';
  if (!activeChatId) return;
  const rows = await window.callama.getHistory(activeChatId);
  let lastAssistantIndex = -1;
  rows.forEach((r, i) => { if (r.role === 'assistant') lastAssistantIndex = i; });
  rows.forEach((row, i) => {
    historyEl.appendChild(bubble(row, { isLastAssistant: i === lastAssistantIndex }));
  });
  historyEl.scrollTop = historyEl.scrollHeight;
}

async function checkOllamaStatus() {
  const { connected } = await window.callama.checkOllama();
  ollamaDot.classList.toggle('bg-base-content', connected);
  ollamaDot.classList.toggle('bg-base-content/30', !connected);
  ollamaStatusText.textContent = connected ? 'connected · subject-scoped' : 'not connected · subject-scoped';
  return connected;
}

async function loadModels() {
  try {
    const models = await window.callama.listModels();
    modelEl.innerHTML = models.map((m) => `<option value="${m}">${m}</option>`).join('');
  } catch (e) {
    modelEl.innerHTML = '<option value="llama3.2:3b">llama3.2:3b (offline)</option>';
  }
}

window.callama.onChunk(({ chatId, delta }) => {
  if (!streamingChats.has(chatId)) {
    streamingChats.add(chatId);
    if (chatId === activeChatId) updateSendButton();
    refreshChatList(); // fire-and-forget — picks up an auto-generated title promptly rather than only after the full response finishes
  }
  if (chatId !== activeChatId) return;
  if (!streamingBubble) {
    const wrap = document.createElement('div');
    wrap.className = 'chat chat-start';
    streamingBubble = document.createElement('div');
    streamingBubble.className = 'chat-bubble markdown-content';
    wrap.appendChild(streamingBubble);
    historyEl.appendChild(wrap);
    streamingRaw = '';
  }
  streamingRaw += delta;
  streamingBubble.innerHTML = marked.parse(streamingRaw);
  historyEl.scrollTop = historyEl.scrollHeight;
});

window.callama.onDone(async ({ chatId, stopped, timedOut }) => {
  streamingChats.delete(chatId);
  if (chatId === activeChatId) {
    if (timedOut) {
      const notice = document.createElement('div');
      notice.className = 'text-[11px] text-base-content/50 mt-1 mb-2';
      notice.textContent = "No response — Ollama's generation queue may be stuck. Try: ollama ps, and pkill ollama if something's wedged, then restart Callama.";
      (streamingBubble ? streamingBubble.parentElement : historyEl).appendChild(notice);
    } else if (stopped && streamingBubble) {
      const tag = document.createElement('div');
      tag.className = 'text-[11px] text-base-content/40 mt-1';
      tag.textContent = 'stopped';
      streamingBubble.parentElement.appendChild(tag);
    }
    streamingBubble = null;
    streamingRaw = '';
    updateSendButton();
  }
  await refreshChatList();
});

formEl.addEventListener('submit', async (e) => {
  e.preventDefault();
  const content = inputEl.value.trim();
  if (!content || !activeChatId || streamingChats.has(activeChatId)) return;
  inputEl.value = '';
  historyEl.appendChild(bubble({ role: 'user', content, id: null }));
  historyEl.scrollTop = historyEl.scrollHeight;
  streamingChats.add(activeChatId);
  updateSendButton();
  await window.callama.send({
    chatId: activeChatId,
    content,
    model: modelEl.value,
    temperature: parseFloat(tempEl.value),
  });
  loadHistory();
});

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); formEl.requestSubmit(); }
});

async function init() {
  await checkOllamaStatus();
  await loadModels();
  setInterval(async () => {
    const wasConnected = ollamaDot.classList.contains('bg-base-content');
    const connected = await checkOllamaStatus();
    if (connected && !wasConnected) await loadModels(); // just came online — refresh the model list
  }, 5000);
  await refreshChatList();
  if (chats.length > 0) {
    await setActiveChat(chats[0].id);
  } else {
    const chat = await window.callama.createChat('predictability');
    await refreshChatList();
    await setActiveChat(chat.id);
  }
}
init();
</script>
</body>
</html>
